spring.application.name=TinyHr

# H2 (인메모리) - PostgreSQL 호환 모드
spring.datasource.url=jdbc:h2:mem:tinyhr;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - 엔티티에서 스키마 생성(참고용)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 콘솔 (/h2-console)
spring.h2.console.enabled=true

# MyBatis - 읽기 전용 매퍼
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드(file BC) - 멀티파트 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 인증(iam) - 개발용 기본값. 운영에서는 환경변수로 시크릿 주입 필요.
tinyhr.auth.otp-ttl-seconds=300
tinyhr.auth.otp-max-attempts=5
tinyhr.auth.otp-resend-cooldown-seconds=60
tinyhr.auth.jwt-access-secret=dev-only-insecure-secret-change-me-please-32bytes+
tinyhr.auth.jwt-access-ttl-seconds=900
tinyhr.auth.jwt-refresh-ttl-seconds=1209600
tinyhr.auth.dev-login-enabled=true
